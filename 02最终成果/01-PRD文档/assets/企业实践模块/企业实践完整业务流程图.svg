<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .bg{fill:#f7f9fc}
      .lane{fill:#ffffff;stroke:#d7dee8;stroke-width:1}
      .lane-title{fill:#334155;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:18px;font-weight:700}
      .box{fill:#ffffff;stroke:#2563eb;stroke-width:2;rx:8;ry:8}
      .box-alt{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:8;ry:8}
      .box-warn{fill:#fff7ed;stroke:#f59e0b;stroke-width:2;rx:8;ry:8}
      .box-ok{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:8;ry:8}
      .text{fill:#1f2937;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:15px}
      .small{fill:#475569;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px}
      .title{fill:#111827;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:26px;font-weight:700}
      .arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1280" height="760"/>
  <text class="title" x="40" y="48">企业实践完整业务流程图</text>

  <rect class="lane" x="40" y="80" width="1200" height="120"/>
  <text class="lane-title" x="60" y="112">申请与审核</text>
  <rect class="box-alt" x="160" y="120" width="170" height="58"/>
  <text class="text" x="207" y="146">填写申请</text>
  <text class="small" x="188" y="166">企业 / 岗位 / 计划</text>
  <rect class="box" x="420" y="120" width="170" height="58"/>
  <text class="text" x="467" y="146">提交审核</text>
  <text class="small" x="450" y="166">进入统一流程</text>
  <rect class="box" x="680" y="120" width="170" height="58"/>
  <text class="text" x="727" y="146">部门审核</text>
  <text class="small" x="710" y="166">查看计划和依据</text>
  <rect class="box" x="940" y="120" width="170" height="58"/>
  <text class="text" x="987" y="146">校级审核</text>
  <text class="small" x="970" y="166">按规则确认</text>

  <rect class="lane" x="40" y="230" width="1200" height="130"/>
  <text class="lane-title" x="60" y="262">实践开展</text>
  <rect class="box-ok" x="180" y="275" width="190" height="62"/>
  <text class="text" x="227" y="301">审核通过</text>
  <text class="small" x="205" y="321">实践进入进行中</text>
  <rect class="box" x="500" y="275" width="190" height="62"/>
  <text class="text" x="547" y="301">过程记录</text>
  <text class="small" x="520" y="321">内容 / 收获 / 材料</text>
  <rect class="box-warn" x="820" y="275" width="190" height="62"/>
  <text class="text" x="867" y="301">异常提醒</text>
  <text class="small" x="842" y="321">逾期 / 缺记录 / 待总结</text>

  <rect class="lane" x="40" y="390" width="1200" height="140"/>
  <text class="lane-title" x="60" y="422">总结确认</text>
  <rect class="box" x="170" y="440" width="190" height="62"/>
  <text class="text" x="217" y="466">生成总结</text>
  <text class="small" x="195" y="486">AI 提炼实践记录</text>
  <rect class="box-ok" x="450" y="440" width="190" height="62"/>
  <text class="text" x="497" y="466">教师确认</text>
  <text class="small" x="478" y="486">修改后正式保存</text>
  <rect class="box" x="730" y="440" width="190" height="62"/>
  <text class="text" x="777" y="466">手工总结</text>
  <text class="small" x="755" y="486">AI 异常时可用</text>
  <rect class="box-ok" x="1010" y="440" width="170" height="62"/>
  <text class="text" x="1055" y="466">实践完成</text>
  <text class="small" x="1038" y="486">等待归档沉淀</text>

  <rect class="lane" x="40" y="560" width="1200" height="140"/>
  <text class="lane-title" x="60" y="592">沉淀与复用</text>
  <rect class="box-ok" x="210" y="610" width="210" height="62"/>
  <text class="text" x="265" y="636">成长档案</text>
  <text class="small" x="238" y="656">企业实践维度沉淀</text>
  <rect class="box" x="540" y="610" width="210" height="62"/>
  <text class="text" x="595" y="636">教师画像</text>
  <text class="small" x="570" y="656">发展能力分析依据</text>
  <rect class="box" x="870" y="610" width="210" height="62"/>
  <text class="text" x="925" y="636">成果线索</text>
  <text class="small" x="895" y="656">案例 / 项目 / 服务成果</text>

  <path class="arrow" d="M330 149 L420 149"/>
  <path class="arrow" d="M590 149 L680 149"/>
  <path class="arrow" d="M850 149 L940 149"/>
  <path class="arrow" d="M1025 178 L275 275"/>
  <path class="arrow" d="M370 306 L500 306"/>
  <path class="arrow" d="M690 306 L820 306"/>
  <path class="arrow" d="M595 337 L265 440"/>
  <path class="arrow" d="M360 471 L450 471"/>
  <path class="arrow" d="M640 471 L1010 471"/>
  <path class="dash" d="M730 471 L640 471"/>
  <path class="arrow" d="M1095 502 L315 610"/>
  <path class="arrow" d="M420 641 L540 641"/>
  <path class="arrow" d="M750 641 L870 641"/>
  <path class="dash" d="M680 149 C620 210,600 235,595 275"/>
  <text class="small" x="610" y="220">退回补正 / 驳回留痕</text>
</svg>
