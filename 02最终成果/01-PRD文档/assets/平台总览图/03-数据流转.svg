<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

  <defs>
    <style>
      .title{font:700 34px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#10233d}
      .subtitle{font:400 18px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#607089}
      .label{font:700 22px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#10233d}
      .small{font:400 18px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#32445f}
      .tiny{font:400 16px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#607089}
      .white{fill:#fff}
      .stroke{stroke:#d7e2f0;stroke-width:2}
      .arrow{stroke:#6b8afd;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .arrow2{stroke:#17a2b8;stroke-width:4;fill:none;marker-end:url(#arrow2)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#6b8afd"/>
    </marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#17a2b8"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f7faff"/>
  <text x="80" y="72" class="title">教师综合发展平台｜数据流转</text>
  <text x="80" y="108" class="subtitle">四类数据来源进入统一底座，再被分析和应用</text>

  <rect x="90" y="190" rx="22" ry="22" width="230" height="110" fill="#eaf2ff" class="stroke"/>
  <text x="205" y="233" text-anchor="middle" class="label">L1</text>
  <text x="205" y="270" text-anchor="middle" class="small">系统对接</text>

  <rect x="90" y="330" rx="22" ry="22" width="230" height="110" fill="#eaf2ff" class="stroke"/>
  <text x="205" y="373" text-anchor="middle" class="label">L2</text>
  <text x="205" y="410" text-anchor="middle" class="small">AI 材料解析</text>

  <rect x="90" y="470" rx="22" ry="22" width="230" height="110" fill="#eaf2ff" class="stroke"/>
  <text x="205" y="513" text-anchor="middle" class="label">L3</text>
  <text x="205" y="550" text-anchor="middle" class="small">业务自动沉淀</text>

  <rect x="90" y="610" rx="22" ry="22" width="230" height="110" fill="#eaf2ff" class="stroke"/>
  <text x="205" y="653" text-anchor="middle" class="label">L4</text>
  <text x="205" y="690" text-anchor="middle" class="small">主动补充</text>

  <rect x="470" y="260" rx="30" ry="30" width="360" height="390" fill="#2457f5"/>
  <text x="650" y="325" text-anchor="middle" class="label white">成长档案</text>
  <text x="650" y="365" text-anchor="middle" class="small white">八维数据统一沉淀</text>
  <rect x="525" y="405" rx="18" ry="18" width="250" height="182" fill="#ffffff" opacity="0.16"/>
  <text x="650" y="445" text-anchor="middle" class="small white">基本信息｜教学工作</text>
  <text x="650" y="480" text-anchor="middle" class="small white">教研科研｜企业实践</text>
  <text x="650" y="515" text-anchor="middle" class="small white">社会服务｜成果荣誉</text>
  <text x="650" y="550" text-anchor="middle" class="small white">个人发展｜考核评价</text>

  <rect x="980" y="215" rx="24" ry="24" width="260" height="140" fill="#e8fbf7" class="stroke"/>
  <text x="1110" y="267" text-anchor="middle" class="label">教师画像</text>
  <text x="1110" y="305" text-anchor="middle" class="small">能力分析 / 发展建议</text>

  <rect x="980" y="405" rx="24" ry="24" width="260" height="140" fill="#fff5e8" class="stroke"/>
  <text x="1110" y="457" text-anchor="middle" class="label">成果认定</text>
  <text x="1110" y="495" text-anchor="middle" class="small">正式认定 / 归档</text>

  <rect x="980" y="595" rx="24" ry="24" width="430" height="140" fill="#fff5e8" class="stroke"/>
  <text x="1195" y="647" text-anchor="middle" class="label">评价应用</text>
  <text x="1195" y="685" text-anchor="middle" class="small">职称评聘 / 聘期考核 / 绩效考核</text>

  <path d="M320 245 H440" class="arrow"/>
  <path d="M320 385 H440" class="arrow"/>
  <path d="M320 525 H440" class="arrow"/>
  <path d="M320 665 H440" class="arrow"/>
  <path d="M830 335 H950" class="arrow"/>
  <path d="M830 455 H950" class="arrow"/>
  <path d="M830 575 H950" class="arrow"/>
  <text x="1260" y="795" class="tiny">来源越多元，底座越完整；底座越完整，分析与应用越可靠</text>
</svg>