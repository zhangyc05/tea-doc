<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

  <defs>
    <style>
      .title{font:700 34px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#10233d}
      .subtitle{font:400 18px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#607089}
      .label{font:700 22px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#10233d}
      .small{font:400 18px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#32445f}
      .tiny{font:400 16px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#607089}
      .white{fill:#fff}
      .stroke{stroke:#d7e2f0;stroke-width:2}
      .arrow{stroke:#6b8afd;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .arrow2{stroke:#17a2b8;stroke-width:4;fill:none;marker-end:url(#arrow2)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#6b8afd"/>
    </marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#17a2b8"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f7faff"/>
  <text x="80" y="72" class="title">教师综合发展平台｜产品架构</text>
  <text x="80" y="108" class="subtitle">以成长档案为底座，向上支撑业务、分析与评价</text>

  <rect x="130" y="170" rx="28" ry="28" width="1340" height="125" fill="#fff5e8" class="stroke"/>
  <text x="180" y="220" class="label">评价应用层</text>
  <rect x="430" y="198" rx="18" ry="18" width="190" height="58" fill="#ffffff"/>
  <rect x="650" y="198" rx="18" ry="18" width="190" height="58" fill="#ffffff"/>
  <rect x="870" y="198" rx="18" ry="18" width="190" height="58" fill="#ffffff"/>
  <rect x="1090" y="198" rx="18" ry="18" width="190" height="58" fill="#ffffff"/>
  <text x="525" y="235" text-anchor="middle" class="small">成果认定</text>
  <text x="745" y="235" text-anchor="middle" class="small">职称评聘</text>
  <text x="965" y="235" text-anchor="middle" class="small">聘期考核</text>
  <text x="1185" y="235" text-anchor="middle" class="small">绩效考核</text>

  <rect x="130" y="330" rx="28" ry="28" width="1340" height="125" fill="#e8fbf7" class="stroke"/>
  <text x="180" y="380" class="label">分析支撑层</text>
  <rect x="620" y="358" rx="18" ry="18" width="220" height="58" fill="#ffffff"/>
  <rect x="880" y="358" rx="18" ry="18" width="220" height="58" fill="#ffffff"/>
  <text x="730" y="395" text-anchor="middle" class="small">教师画像</text>
  <text x="990" y="395" text-anchor="middle" class="small">消息中心</text>

  <rect x="130" y="490" rx="28" ry="28" width="1340" height="125" fill="#eef3ff" class="stroke"/>
  <text x="180" y="540" class="label">业务活动层</text>
  <rect x="430" y="518" rx="18" ry="18" width="190" height="58" fill="#ffffff"/>
  <rect x="650" y="518" rx="18" ry="18" width="190" height="58" fill="#ffffff"/>
  <rect x="870" y="518" rx="18" ry="18" width="190" height="58" fill="#ffffff"/>
  <rect x="1090" y="518" rx="18" ry="18" width="190" height="58" fill="#ffffff"/>
  <text x="525" y="555" text-anchor="middle" class="small">教学反思</text>
  <text x="745" y="555" text-anchor="middle" class="small">教师培训</text>
  <text x="965" y="555" text-anchor="middle" class="small">企业实践</text>
  <text x="1185" y="555" text-anchor="middle" class="small">虚拟教研室</text>

  <rect x="130" y="650" rx="28" ry="28" width="1340" height="125" fill="#2457f5"/>
  <text x="180" y="700" class="label white">数据底座层</text>
  <rect x="620" y="678" rx="18" ry="18" width="480" height="58" fill="#ffffff" opacity="0.18"/>
  <text x="860" y="716" text-anchor="middle" class="small white">成长档案｜八维数据统一沉淀</text>

  <path d="M800 650 V620" class="arrow"/>
  <path d="M800 490 V460" class="arrow"/>
  <path d="M800 330 V300" class="arrow"/>
  <text x="1095" y="814" class="tiny">越往上越接近管理应用，越往下越接近数据根基</text>
</svg>