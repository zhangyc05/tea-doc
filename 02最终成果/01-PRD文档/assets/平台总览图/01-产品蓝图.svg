<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6faff"/>
      <stop offset="58%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#f7fbf8"/>
    </linearGradient>
    <linearGradient id="centerBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f63ff"/>
      <stop offset="100%" stop-color="#083ec8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1fb77a"/>
      <stop offset="100%" stop-color="#0b8c67"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#164b93" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:700 42px 'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#10233d}
      .subtitle{font:400 21px 'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#5d718c}
      .section{font:700 27px 'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#10233d}
      .section-white{font:700 29px 'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#fff}
      .label{font:700 22px 'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#173456}
      .body{font:400 18px 'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#354a66}
      .small{font:400 16px 'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#687b92}
      .white-body{font:400 18px 'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#eef6ff}
      .white-small{font:400 16px 'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#dbeaff}
      .tag{font:700 17px 'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#0d5ee8}
      .card{fill:#fff;stroke:#d8e6f6;stroke-width:2}
      .soft-blue{fill:#eef5ff;stroke:#cfe0ff;stroke-width:2}
      .soft-green{fill:#edf9f4;stroke:#bdebd7;stroke-width:2}
      .soft-orange{fill:#fff6e9;stroke:#f4d7aa;stroke-width:2}
      .arrow-blue{stroke:#1c6cff;stroke-width:5;fill:none;marker-end:url(#arrowBlue)}
      .arrow-green{stroke:#10a36f;stroke-width:5;fill:none;marker-end:url(#arrowGreen)}
      .loop{stroke:#14a777;stroke-width:5;fill:none;stroke-linecap:round;stroke-dasharray:12 12;marker-end:url(#arrowGreen)}
      .thin{stroke:#d7e5f4;stroke-width:2;fill:none}
    </style>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#1c6cff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#10a36f"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 820 C260 760 445 865 720 805 C970 750 1125 835 1600 765 L1600 900 L0 900 Z" fill="#dcecff" opacity="0.72"/>
  <path d="M0 852 C260 800 500 885 805 835 C1050 795 1275 875 1600 820 L1600 900 L0 900 Z" fill="#bcd8ff" opacity="0.54"/>

  <text x="80" y="74" class="title">教师综合发展平台产品蓝图</text>
  <text x="80" y="113" class="subtitle">以成长档案为中心，贯通教师发展活动、能力画像、评价应用与持续改进闭环</text>

  <rect x="1240" y="62" rx="22" ry="22" width="270" height="62" fill="#ffffff" stroke="#cfe0ff" stroke-width="2"/>
  <text x="1375" y="101" text-anchor="middle" class="tag">记录 - 分析 - 应用 - 再发展</text>

  <rect x="82" y="188" rx="26" ry="26" width="315" height="438" class="card" filter="url(#shadow)"/>
  <text x="239" y="237" text-anchor="middle" class="section">业务活动层</text>
  <text x="239" y="270" text-anchor="middle" class="small">在真实发展场景中自然产生数据</text>

  <rect x="122" y="308" rx="18" ry="18" width="112" height="76" class="soft-blue"/>
  <text x="178" y="354" text-anchor="middle" class="label">教学反思</text>
  <rect x="246" y="308" rx="18" ry="18" width="112" height="76" class="soft-blue"/>
  <text x="302" y="354" text-anchor="middle" class="label">教师培训</text>
  <rect x="122" y="407" rx="18" ry="18" width="112" height="76" class="soft-blue"/>
  <text x="178" y="453" text-anchor="middle" class="label">企业实践</text>
  <rect x="246" y="407" rx="18" ry="18" width="112" height="76" class="soft-blue"/>
  <text x="302" y="453" text-anchor="middle" class="label">虚拟教研</text>

  <rect x="122" y="528" rx="20" ry="20" width="236" height="58" fill="#f6f9ff" stroke="#d8e6f6" stroke-width="2"/>
  <text x="240" y="564" text-anchor="middle" class="body">过程记录自动沉淀</text>

  <rect x="497" y="205" rx="34" ry="34" width="405" height="398" fill="url(#centerBlue)" filter="url(#shadow)"/>
  <text x="700" y="262" text-anchor="middle" class="section-white">成长档案</text>
  <text x="700" y="299" text-anchor="middle" class="white-body">教师全生命周期数据底座</text>
  <rect x="550" y="333" rx="22" ry="22" width="300" height="88" fill="#ffffff" opacity="0.16"/>
  <text x="700" y="368" text-anchor="middle" class="white-body">八大维度统一承载</text>
  <text x="700" y="396" text-anchor="middle" class="white-small">可追溯 / 可复用 / 可分析</text>

  <rect x="542" y="452" rx="16" ry="16" width="138" height="52" fill="#ffffff" opacity="0.18"/>
  <text x="611" y="485" text-anchor="middle" class="white-small">基本信息</text>
  <rect x="720" y="452" rx="16" ry="16" width="138" height="52" fill="#ffffff" opacity="0.18"/>
  <text x="789" y="485" text-anchor="middle" class="white-small">教学工作</text>
  <rect x="542" y="518" rx="16" ry="16" width="138" height="52" fill="#ffffff" opacity="0.18"/>
  <text x="611" y="551" text-anchor="middle" class="white-small">教研科研</text>
  <rect x="720" y="518" rx="16" ry="16" width="138" height="52" fill="#ffffff" opacity="0.18"/>
  <text x="789" y="551" text-anchor="middle" class="white-small">考核评价等</text>

  <rect x="1000" y="188" rx="26" ry="26" width="260" height="438" class="card" filter="url(#shadow)"/>
  <text x="1130" y="237" text-anchor="middle" class="section">分析支撑层</text>
  <text x="1130" y="270" text-anchor="middle" class="small">把成长数据转化为发展洞察</text>

  <rect x="1040" y="323" rx="22" ry="22" width="180" height="106" class="soft-green"/>
  <text x="1130" y="365" text-anchor="middle" class="label">教师画像</text>
  <text x="1130" y="397" text-anchor="middle" class="body">能力分析 / 短板识别</text>

  <rect x="1040" y="472" rx="22" ry="22" width="180" height="88" class="soft-green"/>
  <text x="1130" y="509" text-anchor="middle" class="label">消息中心</text>
  <text x="1130" y="539" text-anchor="middle" class="body">提醒 / 待办 / 反馈</text>

  <rect x="1320" y="188" rx="26" ry="26" width="210" height="438" class="card" filter="url(#shadow)"/>
  <text x="1425" y="237" text-anchor="middle" class="section">评价应用层</text>
  <text x="1425" y="270" text-anchor="middle" class="small">支撑正式管理决策</text>

  <rect x="1352" y="313" rx="18" ry="18" width="146" height="54" class="soft-orange"/>
  <text x="1425" y="347" text-anchor="middle" class="label">成果认定</text>
  <rect x="1352" y="386" rx="18" ry="18" width="146" height="54" class="soft-orange"/>
  <text x="1425" y="420" text-anchor="middle" class="label">职称评聘</text>
  <rect x="1352" y="459" rx="18" ry="18" width="146" height="54" class="soft-orange"/>
  <text x="1425" y="493" text-anchor="middle" class="label">聘期考核</text>
  <rect x="1352" y="532" rx="18" ry="18" width="146" height="54" class="soft-orange"/>
  <text x="1425" y="566" text-anchor="middle" class="label">绩效考核</text>

  <path d="M397 407 C430 407 452 407 484 407" class="arrow-blue"/>
  <text x="443" y="382" text-anchor="middle" class="small">数据自动沉淀</text>
  <path d="M902 407 C932 407 957 407 987 407" class="arrow-blue"/>
  <text x="944" y="382" text-anchor="middle" class="small">画像分析</text>
  <path d="M1260 407 C1280 407 1295 407 1310 407" class="arrow-blue"/>
  <text x="1286" y="382" text-anchor="middle" class="small">评价应用</text>

  <path d="M1408 626 C1280 743 1015 779 748 728 C535 687 338 711 234 626" class="loop"/>
  <rect x="585" y="685" rx="22" ry="22" width="430" height="58" fill="#ffffff" stroke="#bdebd7" stroke-width="2"/>
  <text x="800" y="722" text-anchor="middle" class="body">评价结果与发展建议反向牵引下一轮成长</text>

  <rect x="192" y="724" rx="24" ry="24" width="1216" height="78" fill="#ffffff" stroke="#d8e6f6" stroke-width="2"/>
  <text x="298" y="773" text-anchor="middle" class="label">教师减负</text>
  <line x1="415" y1="746" x2="415" y2="781" class="thin"/>
  <text x="555" y="773" text-anchor="middle" class="label">数据统一</text>
  <line x1="675" y1="746" x2="675" y2="781" class="thin"/>
  <text x="815" y="773" text-anchor="middle" class="label">主动发展</text>
  <line x1="935" y1="746" x2="935" y2="781" class="thin"/>
  <text x="1085" y="773" text-anchor="middle" class="label">评价有据</text>
  <line x1="1210" y1="746" x2="1210" y2="781" class="thin"/>
  <text x="1308" y="773" text-anchor="middle" class="label">决策支撑</text>
</svg>
