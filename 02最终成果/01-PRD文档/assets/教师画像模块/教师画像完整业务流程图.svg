  <text class="small" x="185" y="306">完整性 / 可信范围</text>
  <rect class="box" x="420" y="260" width="170" height="62"/>
  <text class="text" x="460" y="286">四维评分</text>
  <text class="small" x="445" y="306">教学 / 教研 / 发展 / 服务</text>
  <rect class="box" x="680" y="260" width="170" height="62"/>
