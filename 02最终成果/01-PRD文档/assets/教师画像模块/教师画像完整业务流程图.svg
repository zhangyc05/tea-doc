  <rect class="box" x="190" y="600" width="210" height="62"/>
  <text class="text" x="245" y="626">发展行动</text>
  <text class="small" x="220" y="646">培训 / 实践 / 教研 / 成果</text>
  <rect class="box" x="540" y="600" width="210" height="62"/>
  <text class="text" x="595" y="626">结果回流</text>
  <text class="small" x="572" y="646">沉淀到成长档案</text>
  <rect class="box-warn" x="890" y="600" width="210" height="62"/>
  <text class="text" x="945" y="626">持续校准</text>
  <text class="small" x="920" y="646">触发重新计算画像</text>

  <path class="arrow" d="M285 163 L245 260"/>
  <path class="arrow" d="M625 163 L505 260"/>
  <path class="arrow" d="M965 163 L505 260"/>
  <path class="arrow" d="M330 291 L420 291"/>
  <path class="arrow" d="M590 291 L680 291"/>
  <path class="arrow" d="M850 291 L940 291"/>
  <path class="arrow" d="M505 322 L245 430"/>
  <path class="arrow" d="M765 322 L505 430"/>
  <path class="arrow" d="M1025 322 L765 430"/>
  <path class="arrow" d="M765 492 L295 600"/>
  <path class="arrow" d="M400 631 L540 631"/>
  <path class="arrow" d="M750 631 L890 631"/>
  <path class="dash" d="M995 600 C1100 520,1130 390,1110 322"/>
