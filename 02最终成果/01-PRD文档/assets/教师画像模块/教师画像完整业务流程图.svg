  <text class="small" x="895" y="151">培训 / 实践 / 教研结果</text>

  <rect class="lane" x="40" y="220" width="1200" height="130"/>
  <text class="lane-title" x="60" y="252">画像计算</text>
  <rect class="box" x="160" y="260" width="170" height="62"/>
