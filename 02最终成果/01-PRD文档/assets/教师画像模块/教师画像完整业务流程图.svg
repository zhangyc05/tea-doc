  <text class="small" x="438" y="476">依据 / 更新时间</text>
  <rect class="box-ok" x="670" y="430" width="190" height="62"/>
  <text class="text" x="717" y="456">发展建议</text>
  <text class="small" x="695" y="476">采纳 / 忽略 / 跳转</text>
