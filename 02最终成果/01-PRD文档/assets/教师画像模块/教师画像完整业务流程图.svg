  <text class="small" x="220" y="151">8 个维度正式事实</text>
  <rect class="box-alt" x="520" y="105" width="210" height="58"/>
  <text class="text" x="575" y="131">模型配置</text>
  <text class="small" x="550" y="151">指标权重 / 等级阈值</text>
  <rect class="box-alt" x="860" y="105" width="210" height="58"/>
