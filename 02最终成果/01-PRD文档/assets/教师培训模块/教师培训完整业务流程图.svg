<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <style>
      .title{font:700 34px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#10233d}
      .subtitle{font:400 18px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#607089}
      .lane{font:700 22px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#10233d}
      .label{font:700 18px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#10233d}
      .small{font:400 16px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#32445f}
      .tiny{font:400 15px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#607089}
      .stroke{stroke:#d7e2f0;stroke-width:2}
      .arrow{stroke:#6b8afd;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .arrow2{stroke:#17a2b8;stroke-width:4;fill:none;marker-end:url(#arrow2)}
      .dash{stroke:#b8c7dc;stroke-width:3;fill:none;stroke-dasharray:8 8;marker-end:url(#arrow3)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6b8afd"/></marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#17a2b8"/></marker>
    <marker id="arrow3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b8c7dc"/></marker>
  </defs>
  <rect width="1800" height="1100" fill="#f7faff"/>
  <text x="70" y="70" class="title">教师培训模块｜完整业务流程图</text>
  <text x="70" y="105" class="subtitle">覆盖平台内培训、培训需求单、外部培训申请三类路径</text>

  <rect x="60" y="145" width="1680" height="180" rx="22" fill="#ffffff" class="stroke"/>
  <rect x="60" y="345" width="1680" height="180" rx="22" fill="#ffffff" class="stroke"/>
  <rect x="60" y="545" width="1680" height="180" rx="22" fill="#ffffff" class="stroke"/>
  <rect x="60" y="745" width="1680" height="250" rx="22" fill="#ffffff" class="stroke"/>

  <text x="90" y="185" class="lane">教师</text>
  <text x="90" y="385" class="lane">系统</text>
  <text x="90" y="585" class="lane">部门管理者</text>
  <text x="90" y="785" class="lane">业务主管部门</text>

  <!-- Teacher lane -->
  <rect x="210" y="190" rx="18" width="180" height="70" fill="#eef3ff"/>
  <text x="300" y="220" text-anchor="middle" class="label">查看培训需求</text>
  <text x="300" y="245" text-anchor="middle" class="tiny">基于教师画像</text>

  <rect x="460" y="190" rx="18" width="180" height="70" fill="#eef3ff"/>
  <text x="550" y="220" text-anchor="middle" class="label">浏览资源</text>
  <text x="550" y="245" text-anchor="middle" class="tiny">判断是否匹配</text>

  <rect x="770" y="165" rx="18" width="190" height="70" fill="#dff7f1"/>
  <text x="865" y="195" text-anchor="middle" class="label">平台内培训申请</text>
  <text x="865" y="220" text-anchor="middle" class="tiny">已有匹配资源</text>

  <rect x="770" y="245" rx="18" width="190" height="70" fill="#fff2dc"/>
  <text x="865" y="275" text-anchor="middle" class="label">培训需求单</text>
  <text x="865" y="300" text-anchor="middle" class="tiny">只有需求，无资源</text>

  <rect x="770" y="325" rx="18" width="190" height="70" fill="#ffe8e8"/>
  <text x="865" y="355" text-anchor="middle" class="label">外部培训申请</text>
  <text x="865" y="380" text-anchor="middle" class="tiny">已有外部机会</text>

  <rect x="1160" y="190" rx="18" width="180" height="70" fill="#eef3ff"/>
  <text x="1250" y="220" text-anchor="middle" class="label">记录学习过程</text>
  <text x="1250" y="245" text-anchor="middle" class="tiny">随手记 / 过程记录</text>

  <rect x="1430" y="190" rx="18" width="180" height="70" fill="#eef3ff"/>
  <text x="1520" y="220" text-anchor="middle" class="label">确认培训总结</text>
  <text x="1520" y="245" text-anchor="middle" class="tiny">AI 初稿 + 人工确认</text>

  <!-- System lane -->
  <polygon points="500,415 550,365 600,415 550,465" fill="#e8fbf7" class="stroke"/>
  <text x="550" y="410" text-anchor="middle" class="label">有匹配</text>
  <text x="550" y="433" text-anchor="middle" class="label">资源？</text>

  <rect x="1110" y="390" rx="18" width="280" height="85" fill="#2457f5"/>
  <text x="1250" y="423" text-anchor="middle" class="label" fill="#fff">统一培训执行</text>
  <text x="1250" y="448" text-anchor="middle" class="tiny" fill="#fff">记录 / 总结 / 沉淀</text>

  <rect x="1430" y="390" rx="18" width="180" height="85" fill="#2457f5"/>
  <text x="1520" y="423" text-anchor="middle" class="label" fill="#fff">成长档案</text>
  <text x="1520" y="448" text-anchor="middle" class="tiny" fill="#fff">个人发展沉淀</text>

  <!-- Dept manager lane -->
  <rect x="1000" y="590" rx="18" width="230" height="70" fill="#eef3ff"/>
  <text x="1115" y="620" text-anchor="middle" class="label">审核培训申请</text>
  <text x="1115" y="645" text-anchor="middle" class="tiny">平台内 / 外部培训</text>

  <rect x="1300" y="590" rx="18" width="250" height="70" fill="#eef3ff"/>
  <text x="1425" y="620" text-anchor="middle" class="label">查看部门培训概览</text>
  <text x="1425" y="645" text-anchor="middle" class="tiny">参与 / 热点 / 转化</text>

  <!-- business owner lane -->
  <rect x="770" y="800" rx="18" width="190" height="70" fill="#fff2dc"/>
  <text x="865" y="830" text-anchor="middle" class="label">评估需求单</text>
  <text x="865" y="855" text-anchor="middle" class="tiny">待评估 / 采纳</text>

  <rect x="1010" y="800" rx="18" width="250" height="70" fill="#fff2dc"/>
  <text x="1135" y="830" text-anchor="middle" class="label">转化需求</text>
  <text x="1135" y="855" text-anchor="middle" class="tiny">新增资源 / 专题计划 / 外部建议</text>

  <rect x="1310" y="800" rx="18" width="240" height="70" fill="#fff2dc"/>
  <text x="1430" y="830" text-anchor="middle" class="label">维护资源供给</text>
  <text x="1430" y="855" text-anchor="middle" class="tiny">持续优化培训库</text>

  <rect x="1010" y="895" rx="18" width="250" height="70" fill="#fff2dc"/>
  <text x="1135" y="925" text-anchor="middle" class="label">未满足需求汇总</text>
  <text x="1135" y="950" text-anchor="middle" class="tiny">识别群体性缺口</text>

  <!-- arrows -->
  <path d="M390 225 H450" class="arrow"/>
  <path d="M640 225 H720" class="arrow"/>
  <path d="M550 260 V355" class="arrow"/>
  <path d="M600 415 H720" class="arrow"/>
  <path d="M550 465 V510 H720" class="arrow"/>
  <text x="645" y="400" class="tiny">有</text>
  <text x="585" y="500" class="tiny">无</text>

  <path d="M960 200 H980 V625 H1000" class="arrow"/>
  <path d="M960 360 H980 V625 H1000" class="arrow"/>
  <path d="M1230 625 H1250 V475" class="arrow2"/>
  <path d="M1390 432 H1420" class="arrow"/>
  <path d="M1610 432 H1650 V225 H1610" class="dash"/>
  <text x="1620" y="312" class="tiny">反哺画像</text>

  <path d="M960 280 H980 V835 H770" class="arrow2"/>
  <path d="M960 280 H980 V930 H1010" class="dash"/>
  <path d="M960 835 H1000" class="arrow2"/>
  <path d="M1260 835 H1300" class="arrow2"/>
  <path d="M1430 870 V895 H1260" class="dash"/>
  <path d="M1260 930 H1300 V870" class="dash"/>

  <path d="M1340 225 H1420" class="arrow"/>
  <path d="M1610 225 H1650 V432 H1610" class="arrow"/>

  <text x="1000" y="770" class="tiny">需求分支：不直接形成培训记录，先驱动供给侧响应</text>
  <text x="1000" y="710" class="tiny">申请分支：平台内培训与外部培训共用统一审核与沉淀机制</text>
</svg>
