<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .bg{fill:#f7f9fc}.lane{fill:#fff;stroke:#d7dee8;stroke-width:1}.lane-title{fill:#334155;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:18px;font-weight:700}
      .box{fill:#fff;stroke:#2563eb;stroke-width:2;rx:8;ry:8}.box-alt{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:8;ry:8}.box-warn{fill:#fff7ed;stroke:#f59e0b;stroke-width:2;rx:8;ry:8}.box-ok{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:8;ry:8}
      .text{fill:#1f2937;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:15px}.small{fill:#475569;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px}.title{fill:#111827;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:26px;font-weight:700}
      .line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.line-dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1280" height="760"/>
  <text class="title" x="40" y="46">消息中心完整业务流程图</text>

  <rect class="lane" x="40" y="75" width="1160" height="105"/>
  <text class="lane-title" x="58" y="108">业务模块</text>
  <rect class="box" x="190" y="95" width="160" height="58"/>
  <text class="text" x="218" y="121">产生业务事件</text>
  <text class="small" x="210" y="141">待办/审核/结果</text>
  <rect class="box" x="430" y="95" width="170" height="58"/>
  <text class="text" x="463" y="121">提交消息事件</text>
  <text class="small" x="455" y="141">来源模块+对象</text>
  <rect class="box-warn" x="680" y="95" width="170" height="58"/>
  <text class="text" x="710" y="121">业务对象变化</text>
  <text class="small" x="707" y="141">撤回/结束/权限变更</text>

  <rect class="lane" x="40" y="195" width="1160" height="210"/>
  <text class="lane-title" x="58" y="230">消息中心</text>
  <rect class="box-alt" x="110" y="245" width="160" height="58"/>
  <text class="text" x="146" y="271">事件校验</text>
  <text class="small" x="132" y="291">来源/模板/对象</text>
  <rect class="box-alt" x="330" y="245" width="170" height="58"/>
  <text class="text" x="362" y="271">模板与规则匹配</text>
  <text class="small" x="365" y="291">类型/优先级/时机</text>
  <rect class="box-alt" x="560" y="245" width="170" height="58"/>
  <text class="text" x="592" y="271">解析接收对象</text>
  <text class="small" x="587" y="291">角色/组织/权限</text>
  <rect class="box-alt" x="790" y="245" width="170" height="58"/>
  <text class="text" x="830" y="271">生成站内消息</text>
  <text class="small" x="826" y="291">内容快照+跳转</text>
  <rect class="box" x="1010" y="245" width="150" height="58"/>
  <text class="text" x="1047" y="271">通道分发</text>
  <text class="small" x="1036" y="291">站内/短信/微信</text>

  <rect class="box-warn" x="330" y="330" width="170" height="48"/>
  <text class="text" x="365" y="360">异常拦截记录</text>
  <rect class="box-warn" x="560" y="330" width="170" height="48"/>
  <text class="text" x="600" y="360">失败重试</text>
  <rect class="box-warn" x="790" y="330" width="170" height="48"/>
  <text class="text" x="826" y="360">异常监控</text>

  <rect class="lane" x="40" y="420" width="1160" height="145"/>
  <text class="lane-title" x="58" y="455">用户与管理角色</text>
  <rect class="box-ok" x="115" y="475" width="150" height="58"/>
  <text class="text" x="154" y="501">接收消息</text>
  <text class="small" x="135" y="521">未读/红点/提醒</text>
  <rect class="box-ok" x="335" y="475" width="150" height="58"/>
  <text class="text" x="374" y="501">查看详情</text>
  <text class="small" x="365" y="521">已读/删除</text>
  <rect class="box-ok" x="555" y="475" width="150" height="58"/>
  <text class="text" x="594" y="501">跳转处理</text>
  <text class="small" x="580" y="521">进入业务页面</text>
  <rect class="box-ok" x="775" y="475" width="150" height="58"/>
  <text class="text" x="807" y="501">处理状态回传</text>
  <text class="small" x="815" y="521">已处理/失效</text>
  <rect class="box" x="995" y="475" width="150" height="58"/>
  <text class="text" x="1034" y="501">偏好设置</text>
  <text class="small" x="1022" y="521">类型/通道/频率</text>

  <rect class="lane" x="40" y="580" width="1160" height="115"/>
  <text class="lane-title" x="58" y="615">统计与归档</text>
  <rect class="box" x="230" y="625" width="180" height="48"/>
  <text class="text" x="265" y="655">触达与已读统计</text>
  <rect class="box" x="520" y="625" width="180" height="48"/>
  <text class="text" x="555" y="655">点击与处理统计</text>
  <rect class="box" x="810" y="625" width="180" height="48"/>
  <text class="text" x="845" y="655">日志归档与审计</text>

  <path class="line" d="M350 124 H430"/>
  <path class="line" d="M515 153 V245"/>
  <path class="line" d="M270 274 H330"/>
  <path class="line" d="M500 274 H560"/>
  <path class="line" d="M730 274 H790"/>
  <path class="line" d="M960 274 H1010"/>
  <path class="line" d="M1085 303 V475"/>
  <path class="line" d="M265 504 H335"/>
  <path class="line" d="M485 504 H555"/>
  <path class="line" d="M705 504 H775"/>
  <path class="line-dash" d="M850 475 V378"/>
  <path class="line-dash" d="M875 330 V303"/>
  <path class="line-dash" d="M645 330 V303"/>
  <path class="line-dash" d="M415 330 V303"/>
  <path class="line-dash" d="M850 533 V625"/>
  <path class="line-dash" d="M630 533 V625"/>
  <path class="line-dash" d="M410 533 V625"/>
  <path class="line-dash" d="M765 153 V245"/>
  <path class="line-dash" d="M1070 475 V303"/>

  <text class="small" x="63" y="728">说明：消息中心只负责统一触达、追踪和跳转承接；业务判断、审核结论和正式业务结果仍由来源业务模块负责。</text>
</svg>
