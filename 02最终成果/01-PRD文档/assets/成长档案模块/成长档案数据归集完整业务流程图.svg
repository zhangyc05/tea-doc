<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .bg{fill:#f7f9fc}
      .lane{fill:#ffffff;stroke:#d7dee8;stroke-width:1}
      .lane-title{fill:#334155;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:18px;font-weight:700}
      .box{fill:#ffffff;stroke:#5b7cfa;stroke-width:2;rx:8;ry:8}
      .box-alt{fill:#eef4ff;stroke:#5b7cfa;stroke-width:2;rx:8;ry:8}
      .box-warn{fill:#fff7ed;stroke:#f59e0b;stroke-width:2;rx:8;ry:8}
      .box-ok{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:8;ry:8}
      .text{fill:#1f2937;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:15px}
      .small{fill:#475569;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px}
      .arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow)}
      .title{fill:#111827;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:26px;font-weight:700}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1280" height="760"/>
  <text class="title" x="40" y="48">成长档案数据归集完整业务流程图</text>

  <rect class="lane" x="40" y="80" width="1200" height="110"/>
  <text class="lane-title" x="60" y="112">数据来源</text>
  <rect class="box-alt" x="180" y="105" width="170" height="56"/>
  <text class="text" x="215" y="130">L1 系统对接</text>
  <text class="small" x="205" y="150">人事 / 教务 / 科研</text>
  <rect class="box-alt" x="400" y="105" width="170" height="56"/>
  <text class="text" x="438" y="130">L3 业务沉淀</text>
  <text class="small" x="427" y="150">培训 / 实践 / 教研</text>
  <rect class="box-alt" x="620" y="105" width="170" height="56"/>
  <text class="text" x="658" y="130">L2 材料解析</text>
  <text class="small" x="650" y="150">证书 / 通知 / 文件</text>
  <rect class="box-alt" x="840" y="105" width="170" height="56"/>
  <text class="text" x="878" y="130">L4 补充采集</text>
  <text class="small" x="870" y="150">教师 / 部门上传</text>
  <rect class="box-alt" x="1060" y="105" width="140" height="56"/>
  <text class="text" x="1090" y="130">公开线索</text>
  <text class="small" x="1082" y="150">官网 / 公示</text>

  <rect class="lane" x="40" y="220" width="1200" height="120"/>
  <text class="lane-title" x="60" y="252">系统处理</text>
  <rect class="box" x="220" y="250" width="170" height="60"/>
  <text class="text" x="254" y="275">解析与结构化</text>
  <text class="small" x="250" y="295">提取字段和依据</text>
  <rect class="box" x="500" y="250" width="170" height="60"/>
  <text class="text" x="542" y="275">教师匹配</text>
  <text class="small" x="530" y="295">姓名 / 工号 / 部门</text>
  <rect class="box" x="780" y="250" width="170" height="60"/>
  <text class="text" x="823" y="275">规则判断</text>
  <text class="small" x="808" y="295">来源优先级 / 冲突</text>

  <rect class="lane" x="40" y="370" width="1200" height="150"/>
  <text class="lane-title" x="60" y="402">人工确认与异常处理</text>
  <rect class="box-ok" x="150" y="420" width="170" height="62"/>
  <text class="text" x="196" y="446">自动入档</text>
  <text class="small" x="180" y="466">满足规则并留痕</text>
  <rect class="box-warn" x="410" y="420" width="180" height="62"/>
  <text class="text" x="455" y="446">候选数据</text>
  <text class="small" x="438" y="466">教师 / 管理者确认</text>
  <rect class="box-warn" x="680" y="420" width="180" height="62"/>
  <text class="text" x="725" y="446">待核验数据</text>
  <text class="small" x="708" y="466">重复 / 冲突 / 无法匹配</text>
  <rect class="box-warn" x="950" y="420" width="170" height="62"/>
  <text class="text" x="995" y="446">线索审核</text>
  <text class="small" x="980" y="466">公开信息人工确认</text>

  <rect class="lane" x="40" y="550" width="1200" height="150"/>
  <text class="lane-title" x="60" y="582">正式沉淀与复用</text>
  <rect class="box-ok" x="220" y="600" width="190" height="62"/>
  <text class="text" x="264" y="626">正式档案数据</text>
  <text class="small" x="248" y="646">来源 / 材料 / 版本留痕</text>
  <rect class="box" x="520" y="600" width="190" height="62"/>
  <text class="text" x="558" y="626">8 个维度归档</text>
  <text class="small" x="550" y="646">基本 / 教学 / 成果等</text>
  <rect class="box" x="820" y="600" width="260" height="62"/>
  <text class="text" x="878" y="626">下游模块引用</text>
  <text class="small" x="850" y="646">画像 / 认定 / 评聘 / 考核</text>

  <path class="arrow" d="M265 162 L265 250"/>
  <path class="arrow" d="M485 162 L360 250"/>
  <path class="arrow" d="M705 162 L360 250"/>
  <path class="arrow" d="M925 162 L360 250"/>
  <path class="arrow" d="M1130 162 L865 250"/>
  <path class="arrow" d="M390 280 L500 280"/>
  <path class="arrow" d="M670 280 L780 280"/>
  <path class="arrow" d="M865 310 L235 420"/>
  <path class="arrow" d="M865 310 L500 420"/>
  <path class="arrow" d="M865 310 L770 420"/>
  <path class="arrow" d="M865 310 L1035 420"/>
  <path class="arrow" d="M235 482 L315 600"/>
  <path class="arrow" d="M500 482 L315 600"/>
  <path class="arrow" d="M770 482 L315 600"/>
  <path class="arrow" d="M1035 482 L315 600"/>
  <path class="arrow" d="M410 631 L520 631"/>
  <path class="arrow" d="M710 631 L820 631"/>
  <path class="dash" d="M950 600 C1000 535,1010 510,1035 482"/>
  <text class="small" x="980" y="560">不通过则驳回留痕</text>
</svg>
