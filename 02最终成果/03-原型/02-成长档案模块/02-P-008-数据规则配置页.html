<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据规则配置 - 教师综合发展平台</title>
  <link rel="stylesheet" href="../_prototype/prototype.css">
</head>
<body>
  <div id="page"></div>
  <div id="layer" class="overlay hidden"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="../_prototype/prototype.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var role = Prototype.query("role", "admin");
      var state = Prototype.query("state", "draft");
      var active = 0;
      var page = document.getElementById("page");
      var rules = [
        ["RULE-ARCH-001", "企业实践材料识别规则", "DOC-2026-018 / DOC-2026-024", "生效中", "v1.2", "实践单位、实践周期、岗位任务、结项证明", "来源字段缺失或时间范围冲突时进入异常处理"],
        ["RULE-CLUE-001", "公开线索候选识别规则", "ARCH-CLUE-*", "草案", "v0.8", "姓名、学院、赛事或任职信息", "匹配不足时保持候选，不直接入档"],
        ["RULE-EXC-001", "异常判定规则", "材料与线索", "生效中", "v1.0", "对象 ID、来源、字段建议、责任范围", "重复、冲突、来源不可信时进入异常处理"]
      ];
      if (role !== "admin" && role !== "business_manager") { Prototype.deny("业务主管部门或系统管理员身份"); return; }
      function isAdmin() { return role === "admin"; }
      function badge(status) { return status === "生效中" ? '<span class="badge success">生效中</span>' : status === "已停用" ? '<span class="badge danger">已停用</span>' : '<span class="badge warning">草案</span>'; }
      function manageShell() {
        page.className = "management";
        page.innerHTML = '<header class="manage-head"><div class="brand"><span class="manage-logo">教</span>教师综合发展平台</div><div class="head-right"><div class="head-select">2025-2026 学年 第二学期 ▾</div><div class="head-user"><span class="head-avatar">陈</span><span>陈璐</span> ▾</div></div></header><div class="manage-shell"><aside class="manage-side"><p class="menu-label">成长档案</p><button class="menu-item">公开线索审核</button><button class="menu-item">异常数据处理</button><button class="menu-item active">数据规则配置</button><button class="menu-item">档案质量</button></aside><div class="manage-body"><header class="context-bar"><div class="row"><strong>成长档案</strong><span class="muted">/ 数据规则配置</span></div><div class="row"><span class="badge info">授权业务范围</span><span>陈璐 · 业务主管部门</span></div></header><main class="manage-main" id="main"></main></div></div>';
      }
      function adminShell() {
        page.className = "admin";
        page.innerHTML = '<aside class="admin-side"><div class="brand"><span class="brand-mark">管</span>系统管理</div><p class="menu-label">数据治理</p><button class="menu-item">数据任务监控</button><button class="menu-item active">数据规则配置</button><button class="menu-item">异常数据处理</button><p class="menu-label">审计</p><button class="menu-item">操作日志</button></aside><div class="admin-body"><header class="env-bar"><div class="row"><span class="env-chip">生产环境</span><strong>数据规则配置</strong></div><div class="user-pill"><span class="avatar">孙</span><span>孙嘉禾</span></div></header><main class="admin-main" id="main"></main></div>';
      }
      function listHtml() {
        return '<section class="card confirm-queue"><div class="card-pad"><h2 class="section-heading" style="margin:0">规则列表</h2><p class="muted">仅展示当前演示规则对象。</p></div>' + rules.map(function (rule, index) {
          return '<button type="button" class="confirm-item ' + (index === active ? 'active' : '') + '" data-index="' + index + '">' + badge(rule[3]) + '<h3>' + rule[1] + '</h3><p>' + rule[0] + ' · ' + rule[4] + '<br>' + rule[2] + '</p></button>';
        }).join('') + '</section>';
      }
      function detailHtml() {
        var rule = rules[active];
        var adminActions = '<button class="btn primary" id="publish" type="button">发布规则</button><button class="btn outline" id="disable" type="button">停用</button><button class="btn" id="rollback" type="button">回滚</button><button class="btn ghost" id="audit" type="button">查看审计</button>';
        var bizActions = '<button class="btn primary" id="edit-draft" type="button">编辑草案</button><button class="btn outline" id="submit-release" type="button">提交发布申请</button><button class="btn ghost" id="impact" type="button">查看影响说明</button>';
        return '<section class="card"><div class="evidence-panel"><div class="spread"><span class="badge info">' + rule[0] + '</span>' + badge(rule[3]) + '</div><h2>' + rule[1] + '</h2><dl class="evidence-fields"><dt>适用对象</dt><dd>' + rule[2] + '</dd><dt>版本</dt><dd>' + rule[4] + '</dd><dt>字段映射</dt><dd>' + rule[5] + '</dd><dt>触发条件</dt><dd>' + rule[6] + '</dd><dt>配置边界</dt><dd>规则只影响后续识别、候选生成和异常判定，不直接修改教师档案事实。</dd></dl><div class="evidence-source"><strong>运行影响</strong><br>规则变更后只影响后续采集和识别任务；已有材料确认、线索审核与异常处理仍按各自页面完成。</div></div><div class="confirm-actions">' + (isAdmin() ? adminActions : bizActions) + '</div><div class="process-note" id="note">当前状态：' + (state === "submitted" ? "发布申请待系统管理员处理" : state === "published" ? "规则发布留痕已记录" : state === "disabled" ? "规则已停用，需审计后恢复" : "草案或生效规则可查看") + '</div></section>';
      }
      function render() {
        if (isAdmin()) adminShell(); else manageShell();
        document.getElementById("main").innerHTML = '<section class="spread mobile-stack"><div><p class="eyebrow">规则治理 / 成长档案</p><h1 class="title">数据规则配置</h1><p class="subtitle">配置字段映射、候选识别和异常触发规则；规则变更不直接修改教师档案事实。</p></div><span class="snapshot-note"><span class="dot"></span>J-06</span></section><section class="metric-grid manage-summary"><div class="metric"><span>演示规则</span><b>3</b><span>不扩展全量规则库</span></div><div class="metric"><span>草案</span><b>1</b><span>需发布确认</span></div><div class="metric"><span>生效中</span><b>2</b><span>可审计追溯</span></div><div class="metric"><span>直接入档</span><b>0</b><span>规则不写档案事实</span></div></section><div class="confirm-grid">' + listHtml() + detailHtml() + '</div>';
      }
      render();
      page.addEventListener("click", function (event) {
        var item = event.target.closest("[data-index]");
        if (item) { active = Number(item.dataset.index); render(); return; }
        if (event.target.id === "edit-draft") { state = "draft"; Prototype.toast("已进入草案编辑演示，尚未发布生效"); }
        if (event.target.id === "submit-release") { state = "submitted"; Prototype.setState("submitted"); render(); Prototype.toast("发布申请已提交，等待系统管理员处理"); }
        if (event.target.id === "impact") Prototype.layer("影响说明", "<p>规则只影响后续识别和候选生成，不会直接修改 DOC 或 ARCH-CLUE 对象状态。</p>", "", true, event.target);
        if (event.target.id === "publish") { state = "published"; Prototype.setState("published"); render(); Prototype.toast("规则发布留痕已记录"); }
        if (event.target.id === "disable") { state = "disabled"; Prototype.setState("disabled"); rules[active][3] = "已停用"; render(); Prototype.toast("规则已停用，后续采集不再使用该版本"); }
        if (event.target.id === "rollback") Prototype.layer("回滚规则", "<p>回滚仅恢复规则版本，不改变已办理的材料确认或异常处理结果。</p>", '<button class="btn primary" type="button" data-close>知道了</button>', false, event.target);
        if (event.target.id === "audit") Prototype.layer("规则审计", "<p>v1.2 发布：孙嘉禾 · 2026-05-23<br>草案提交：陈璐 · 2026-05-22<br>最近影响对象：DOC-2026-018、ARCH-CLUE-2026-001</p>", "", true, event.target);
      });
    });
  </script>
</body>
</html>
