<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>部门教师画像分析 - 教师综合发展平台</title>
  <link rel="stylesheet" href="../_prototype/prototype.css">
</head>
<body>
  <div id="page"></div>
  <div id="layer" class="overlay hidden"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="../_prototype/prototype.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var role = Prototype.query("role", "department_manager");
      var journey = Prototype.query("journey", "J-03");
      var page = document.getElementById("page");
      var allowed = ["department_manager", "business_manager", "school_leader"];
      if (allowed.indexOf(role) === -1) { Prototype.deny("部门管理者、业务主管部门或校级领导身份"); return; }
      var leader = role === "school_leader";
      var business = role === "business_manager";
      var people = [
        ["PROFILE-2026-LIN", "林知夏", "实践能力待确认", "DOC-2026-018", "教学能力优势，企业实践依据待确认", "warning"],
        ["PROFILE-2026-ZHOU", "周启明", "教学能力稳定", "EVIDENCE-TEACH-002", "课程建设依据充分，服务能力稳定", "success"],
        ["PROFILE-2026-WANG", "王若辰", "教研依据不足", "EVIDENCE-RESEARCH-003", "教改项目与成果转化依据不足", "info"]
      ];
      var active = 0;
      function shell() {
        var name = role === "department_manager" ? "周明远" : role === "business_manager" ? "陈璐" : "王宁远";
        var scope = leader ? "校级只读汇总" : business ? "授权业务范围" : "智能制造学院";
        page.className = "management";
        page.innerHTML = '<header class="manage-head"><div class="brand"><span class="manage-logo">教</span>教师综合发展平台</div><div class="head-right"><div class="head-select">2025-2026 学年 第二学期 ▾</div><div class="head-user"><span class="head-avatar">' + name.slice(0,1) + '</span><span>' + name + '</span> ▾</div></div></header><div class="manage-shell"><aside class="manage-side"><p class="menu-label">教师画像</p><button class="menu-item active">画像分析</button><button class="menu-item">依据下钻</button><p class="menu-label">成长档案</p><button class="menu-item">待确认数据</button><button class="menu-item">档案质量</button></aside><div class="manage-body"><header class="context-bar"><div class="row"><strong>教师画像</strong><span class="muted">/ 部门教师画像分析</span></div><div class="row"><span class="badge info">' + scope + '</span><span>' + name + '</span></div></header><main class="manage-main" id="main"></main></div></div>';
      }
      function badge(type) { return type === "success" ? '<span class="badge success">已确认依据</span>' : type === "warning" ? '<span class="badge warning">待确认依据</span>' : '<span class="badge info">依据不足</span>'; }
      function listHtml() {
        return '<section class="card confirm-queue"><div class="card-pad"><h2 class="section-heading" style="margin:0">重点样本</h2><p class="muted">只展示已登记演示样本。</p></div>' + people.map(function (p, i) {
          return '<button class="confirm-item ' + (i === active ? 'active' : '') + '" type="button" data-person="' + i + '">' + badge(p[5]) + '<h3>' + p[1] + '</h3><p>' + p[0] + '<br>' + p[2] + '</p></button>';
        }).join('') + '</section>';
      }
      function detailHtml() {
        var p = people[active];
        var actions = leader ? '<button class="btn outline" id="view-source" type="button">查看依据说明</button>' : business ? '<button class="btn outline" id="view-source" type="button">查看依据说明</button><button class="btn" id="rule-impact" type="button">查看规则影响</button>' : '<button class="btn primary" id="handle-pending" type="button">处理待确认依据</button><button class="btn outline" id="view-source" type="button">查看依据说明</button>';
        return '<section class="card"><div class="evidence-panel"><div class="spread"><span class="badge info">' + p[0] + '</span>' + badge(p[5]) + '</div><h2>' + p[1] + '画像依据摘要</h2><dl class="evidence-fields"><dt>所属范围</dt><dd>智能制造学院 / 授权样本</dd><dt>画像状态</dt><dd>' + p[2] + '</dd><dt>关联依据</dt><dd>' + p[3] + '</dd><dt>依据说明</dt><dd>' + p[4] + '</dd><dt>分析边界</dt><dd>不展示排名、综合分或自动评价裁决。</dd></dl><div class="evidence-source"><strong>管理建议</strong><br>' + (p[3] === "DOC-2026-018" ? '该教师实践能力画像受待确认材料影响，需回到待确认数据页完成人工确认。' : '当前仅展示画像依据摘要，不直接修改成长档案事实。') + '</div></div><div class="confirm-actions">' + actions + '</div><div class="process-note">画像分析仅用于管理支持和依据下钻，不作为职称、绩效或聘期考核裁决。</div></section>';
      }
      function render() {
        shell();
        var readonly = leader ? " · 只读" : "";
        document.getElementById("main").innerHTML = '<section class="spread mobile-stack"><div><p class="eyebrow">管理分析 / 教师画像</p><h1 class="title">部门教师画像分析' + readonly + '</h1><p class="subtitle">查看授权范围内教师画像样本分布、重点关注对象和依据下钻。页面不展示排名或综合评分。</p></div><span class="snapshot-note"><span class="dot"></span>' + journey + ' · PROFILE-SNAPSHOT-DEPT-001</span></section><section class="metric-grid manage-summary"><div class="metric"><span>样本人数</span><b>3</b><span>演示样本</span></div><div class="metric"><span>待确认依据</span><b>1</b><span>DOC-2026-018</span></div><div class="metric"><span>依据不足</span><b>1</b><span>教研能力</span></div><div class="metric"><span>排名/综合分</span><b>0</b><span>禁止展示</span></div></section><section class="card card-pad"><h2 class="section-heading">能力维度分布</h2><div class="metric-grid"><div class="metric"><span>教学能力</span><b>优势</b><span>依据充分</span></div><div class="metric"><span>实践能力</span><b>待确认</b><span>1 项材料影响</span></div><div class="metric"><span>教研能力</span><b>需补充</b><span>依据不足</span></div><div class="metric"><span>服务能力</span><b>稳定</b><span>记录可追溯</span></div></div></section><div class="confirm-grid">' + listHtml() + detailHtml() + '</div>';
      }
      function goEvidence() {
        var p = people[active];
        var target = new URL("03-P-003-画像依据说明页.html", window.location.href);
        target.searchParams.set("role", role); target.searchParams.set("object", p[0]); target.searchParams.set("journey", journey); target.searchParams.set("from", "03-P-002"); window.location.href = target.toString();
      }
      render();
      page.addEventListener("click", function (event) {
        var p = event.target.closest("[data-person]");
        if (p) { active = Number(p.dataset.person); render(); return; }
        if (event.target.id === "handle-pending") {
          var target = new URL("../02-成长档案模块/02-P-002-待确认数据页.html", window.location.href);
          target.searchParams.set("role", "department_manager"); target.searchParams.set("object", "DOC-2026-018"); target.searchParams.set("journey", "J-05"); target.searchParams.set("state", "pending"); target.searchParams.set("from", "03-P-002"); window.location.href = target.toString();
        }
        if (event.target.id === "rule-impact") {
          var rule = new URL("../02-成长档案模块/02-P-008-数据规则配置页.html", window.location.href);
          rule.searchParams.set("role", "business_manager"); rule.searchParams.set("object", "RULE-ARCH-001"); rule.searchParams.set("journey", "J-06"); rule.searchParams.set("from", "03-P-002"); window.location.href = rule.toString();
        }
        if (event.target.id === "view-source") goEvidence();
      });
    });
  </script>
</body>
</html>
